name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze .

      - name: Test widget_tooltip
        run: cd packages/widget_tooltip && flutter test

      - name: Test burst_icon_button
        run: cd packages/burst_icon_button && flutter test

      - name: Test floating_widget
        run: cd packages/floating_widget && flutter test
